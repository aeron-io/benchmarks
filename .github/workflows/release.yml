name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
  JAVA_VERSION: '17'

jobs:
  release-java:
    name: Release benchmarks-api
    if: github.repository == 'aeron-io/benchmarks'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Check version.txt is a release version
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          if [[ "${version}" == *-SNAPSHOT ]]; then
            echo "::error::version.txt is ${version}; snapshots are not published"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version.txt (${version})"
            exit 1
          fi
      - name: Setup java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup BUILD_JAVA_HOME & BUILD_JAVA_VERSION
        run: |
          java -Xinternalversion
          echo "BUILD_JAVA_HOME=${JAVA_HOME}" >> $GITHUB_ENV
          echo "BUILD_JAVA_VERSION=${{ env.JAVA_VERSION }}" >> $GITHUB_ENV
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-provider: basic
      - name: Publish with Gradle
        run: ./gradlew :benchmarks-api:build :benchmarks-api:publishMavenJavaPublicationToArtifactoryRepository
        env:
          ARTIFACTORY_PUBLISH_URL: ${{ secrets.ARTIFACTORY_PUBLISH_URL }}
          ARTIFACTORY_WRITER_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_WRITER_ACCESS_TOKEN }}
